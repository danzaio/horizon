<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Guitar Briga III — Lendas do Planalto</title>
<link rel="icon" href="data:,">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stack{position:relative;overflow:hidden;background:#000}
#stack canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.9}
#touch{position:fixed;inset:0;pointer-events:none;display:none}
#touch.on{display:block}
.tb{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(10,4,14,.45);border:3px solid rgba(255,255,255,.6);color:#fff;
  font:900 13px Impact,'Arial Black',sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1;
  text-shadow:0 2px 0 #000;box-sizing:border-box;letter-spacing:.5px}
.tb.dn{background:rgba(255,255,255,.35)}
</style>
</head>
<body>
<div id="wrap"><div id="stack"><canvas id="bg"></canvas><canvas id="gl"></canvas><canvas id="fg"></canvas><div id="grain"></div></div></div>
<div id="touch">
  <div class="tb" data-k="KeyA" style="left:14px;bottom:78px;width:64px;height:64px">◀</div>
